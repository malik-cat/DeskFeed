name: Build and sign release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend package
        working-directory: DeskFeed Backend
        run: |
          npm install
          npm pack

      - name: Create agent source archive
        run: |
          mkdir -p release
          cp "DeskFeed Backend"/*.tgz release/
          tar -czf release/deskfeed-agent.tar.gz -C "DeskFeed Agent" \
            --exclude=venv --exclude=__pycache__ --exclude="*.log" .

      - name: Compute hashes
        id: hash
        run: |
          cd release
          sha256sum * | base64 -w0 > ../hashes.b64
          echo "hashes=$(cat ../hashes.b64)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  provenance:
    needs: [build]
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
